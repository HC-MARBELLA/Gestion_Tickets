<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestor de tickets</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--mut:#6b7385;--bd:#dfe2e8;--ar:#d9480f;--ar-bg:#fff0e8;--pe:#b07d00;--pe-bg:#fff6dc;--ok:#2b8a3e;--ok-bg:#e6f5ea;--ac:#2458d6;--ac-bg:#e7eeff;--due-bg:#fff0f5}
@media (prefers-color-scheme:dark){:root{--bg:#14171e;--card:#1e222b;--tx:#e6e9ef;--mut:#8b93a5;--bd:#303644;--ar:#ff8a50;--ar-bg:#3a2418;--pe:#f0bf3a;--pe-bg:#3a3010;--ok:#5fcf7a;--ok-bg:#16301d;--ac:#6b9bff;--ac-bg:#1c2a4d;--due-bg:#3a1826}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,Segoe UI,sans-serif}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:5}
h1{font-size:17px;margin:0 8px 0 0}
nav button{background:none;border:0;padding:6px 12px;border-radius:6px;color:var(--mut);cursor:pointer;font:inherit}
nav button.on{background:var(--bg);color:var(--tx);font-weight:600}
#q{flex:1;min-width:200px;padding:7px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
main{max-width:none;margin:0;padding:16px 24px}
.new{display:flex;gap:8px;margin-bottom:18px}
.new input{flex:1;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
.b{padding:7px 12px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);cursor:pointer;font:inherit}
.b:hover{border-color:var(--ac)}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:22px 0 8px}
.empty{color:var(--mut);padding:8px 0}
.t{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--bd);border-radius:8px;padding:5px 10px;margin-bottom:6px;font-size:14px;line-height:1.35}
.t.s-ar{border-left-color:var(--ar)}.t.s-pe{border-left-color:var(--pe)}.t.s-ok{border-left-color:var(--ok)}.t.s-due{border-left-color:#d6336c;background:var(--due-bg)}
a.b{text-decoration:none;display:inline-block}
.t .ib:not(.fold){opacity:0;transition:opacity .12s}
.t:hover .ib,.t .ib:focus-visible{opacity:1}
@media (hover:none){.t .ib{opacity:1!important}}
.l .b{padding:2px 9px;font-size:13px}
.rem{font:inherit;font-size:12px;padding:0 4px;border:1px solid var(--bd);border-radius:5px;background:var(--bg);color:var(--mut)}
.rem.due{border-color:#d6336c;color:#d6336c}
.badge{font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;background:#d6336c;color:#fff;white-space:nowrap}
.draft label{font-size:12px;color:var(--mut)}
.t.closed{opacity:.75}
.th{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-bottom:1px;gap:8px}
.l{display:flex;align-items:flex-start;gap:8px;padding:1px 0}
.l .tx{flex:1;word-break:break-word}
.l.done .tx{color:var(--mut)}
.l .d{color:var(--mut);font-size:12px;white-space:nowrap}
.pill{font-size:12px;padding:1px 8px;border-radius:10px;border:0;white-space:nowrap;font:inherit;font-size:12px}
.pill.ar{background:var(--ar-bg);color:var(--ar)}
.pill.pe{background:var(--pe-bg);color:var(--pe)}
.pill.re{background:var(--ok-bg);color:var(--ok)}
button.pill{cursor:pointer}
.ib{background:none;border:0;cursor:pointer;color:var(--mut);padding:0 4px;font-size:14px}
.ib:hover{color:var(--tx)}
.draft{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:2px 0}
.draft input,.l input.ed{flex:1;min-width:180px;padding:6px 8px;border:1px solid var(--ac);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
mark{background:#ffe066;color:#000;border-radius:2px}
.chip{background:var(--ac-bg);color:var(--ac);border-radius:4px;padding:0 4px;cursor:pointer;font-weight:600}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);padding:20px;max-width:420px;width:92vw}
dialog::backdrop{background:#0007}
dialog .row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
dialog h3{margin:0 0 10px;font-size:16px}
dialog label{display:block;font-size:12px;color:var(--mut);margin-top:8px}
dialog input{width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.c.open{grid-column:1/-1}
.c .nm{font-weight:600;font-size:16px}
.c .ro{color:var(--mut);font-size:13px}
.c .ln{margin-top:2px}
.c a{color:var(--ac);text-decoration:none}
.c .ac{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.c .tl{margin-top:10px;border-top:1px solid var(--bd);padding-top:10px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.fold{font-size:13px;padding:0 6px 0 0}
.sum{margin-left:22px;padding:2px 0;color:var(--mut);font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut)}
.mn{position:fixed;z-index:50;background:var(--card);border:1px solid var(--bd);border-radius:8px;max-height:280px;overflow:auto;box-shadow:0 6px 20px #0003;min-width:320px}
.mi{padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--bd)}
.mi:last-child{border:0}
.mi.sel{background:var(--ac-bg)}
.mi small{color:var(--mut)}
</style>
</head>
<body>
<header>
  <h1>Tickets</h1>
  <nav><button id="nhoy" class="on">Mi dia</button><button id="nbus">Buscar</button><button id="ncon">Contactos</button></nav>
  <input id="q" type="search" placeholder="Buscar empresa, telefono, nombre...">
  <a class="b" href="/api/export" download title="Descargar copia de todos los datos">Exportar</a><button class="b" id="imp" title="Restaurar desde un fichero exportado">Importar</button><input type="file" id="impf" accept=".json,application/json" hidden>
</header>
<main id="main"></main>
<dialog id="dlg"><div id="dmsg"></div><div class="row" id="dbtn"></div></dialog>
<dialog id="cdlg"><form id="cform">
  <h3 id="ctitle">Contacto</h3>
  <label>Nombre</label><input id="cn" autocomplete="off">
  <label>Empresa</label><input id="cc" autocomplete="off">
  <label>Puesto</label><input id="cr" autocomplete="off">
  <label>Telefono</label><input id="cp" autocomplete="off">
  <label>Correo</label><input id="ce" autocomplete="off">
  <div class="row"><button type="button" class="b" id="cno">Omitir</button><button class="b pri">Guardar</button></div>
</form></dialog>

<script>
const AR='A realizar', PE='Pendiente', RE='Realizada';
let tickets=[], contacts=[], view='hoy', query='';
const expanded=new Set(), declined=new Set();
let collapsed=new Set();
try{collapsed=new Set(JSON.parse(localStorage.getItem('collapsed')||'[]'))}catch(e){}
const saveCollapsed=()=>{try{localStorage.setItem('collapsed',JSON.stringify([...collapsed]))}catch(e){}};
const toggleFold=id=>{collapsed.has(id)?collapsed.delete(id):collapsed.add(id);saveCollapsed();render()};
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const now=()=>new Date().toISOString();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const fmt=iso=>{const d=new Date(iso);return d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})};
const days=iso=>Math.floor((Date.now()-new Date(iso))/864e5);
const cls=s=>s===AR?'ar':s===PE?'pe':'re';
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const digits=s=>(s||'').replace(/[\s.\-()+]/g,'');
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;

async function load(){
  [tickets,contacts]=await Promise.all([fetch('/api/tickets').then(r=>r.json()),fetch('/api/contacts').then(r=>r.json())]);
  render();
}
async function save(t){t.updated=now();await fetch('/api/tickets/'+t.id,{method:'PUT',body:JSON.stringify(t)});render()}
async function remove(t){await fetch('/api/tickets/'+t.id,{method:'DELETE'});tickets=tickets.filter(x=>x!==t);render()}
async function saveContact(c){
  await fetch('/api/contacts/'+c.id,{method:'PUT',body:JSON.stringify(c)});
  const i=contacts.findIndex(x=>x.id===c.id);if(i<0)contacts.push(c);else contacts[i]=c;render();
}
async function removeContact(c){await fetch('/api/contacts/'+c.id,{method:'DELETE'});contacts=contacts.filter(x=>x!==c);render()}

function ask(msg,buttons){return new Promise(res=>{
  $('#dmsg').textContent=msg;const b=$('#dbtn');b.innerHTML='';
  buttons.forEach(([label,val,p])=>{const e=document.createElement('button');e.className='b'+(p?' pri':'');e.textContent=label;e.onclick=()=>{$('#dlg').close();res(val)};b.appendChild(e)});
  $('#dlg').oncancel=()=>res(null);$('#dlg').showModal();b.firstChild.focus();
})}

/* ---------- formulario de contacto ---------- */
function contactForm(title,c,omitLabel){return new Promise(res=>{
  $('#ctitle').textContent=title;$('#cno').textContent=omitLabel||'Cancelar';
  $('#cn').value=c.name||'';$('#cc').value=c.company||'';$('#cr').value=c.role||'';$('#cp').value=c.phone||'';$('#ce').value=c.email||'';
  const d=$('#cdlg');let done=false;
  const fin=v=>{if(done)return;done=true;d.close();res(v)};
  $('#cform').onsubmit=e=>{e.preventDefault();
    const n={...c,name:$('#cn').value.trim(),company:$('#cc').value.trim(),role:$('#cr').value.trim(),phone:$('#cp').value.trim(),email:$('#ce').value.trim()};
    if(!n.name&&!n.phone&&!n.email)return;fin(n)};
  $('#cno').onclick=()=>fin(null);d.oncancel=()=>fin(null);
  d.showModal();$('#cn').focus();
})}
async function newContactDialog(prefill){
  const n=await contactForm('Nuevo contacto',{id:uid(),created:now(),...prefill});
  if(n)await saveContact(n);
}
async function editContactDialog(c){
  const n=await contactForm('Editar contacto',c);if(n)await saveContact(n);
}

/* ---------- deteccion de telefonos / correos en las notas ---------- */
const PHONE=/(?<!\d)(?:\+34\s?)?[6-9]\d{2}[\s.-]?\d{3}[\s.-]?\d{3}(?!\d)/g;
const EMAIL=/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g;
const NAME='[A-Za-zÁÉÍÓÚÑáéíóúñ]+';
const RE1=new RegExp('\\b(?:con|llamado|llamada|hablado con)\\s+@?('+NAME+'(?:\\s+'+NAME+')?)\\s+(?:de|del|en)\\s+([A-Za-zÁÉÍÓÚÑáéíóúñ0-9.]+)','i');
const CAPN='[A-ZÁÉÍÓÚÑ][a-záéíóúñ]*';
const RE2=new RegExp('\\b(?:a|con)\\s+@?('+CAPN+'(?:\\s+'+CAPN+')?)\\s+(?:de|del|en)\\s+([A-ZÁÉÍÓÚÑ][\\w.]*)');
function guessContact(text,email){
  let name='',company='';
  const m=text.match(RE1)||text.match(RE2);
  if(m){name=cap(m[1]);company=cap(m[2].replace(/[.,]$/,''))}
  if(!company&&email){const d=email.split('@')[1].split('.')[0];if(!/^(gmail|hotmail|outlook|yahoo|icloud|live)$/i.test(d))company=cap(d)}
  return {name,company};
}
function known(phone,email){
  const dp=digits(phone).slice(-9),em=(email||'').toLowerCase();
  return contacts.some(c=>(dp&&digits(c.phone).slice(-9)===dp)||(em&&(c.email||'').toLowerCase()===em));
}
async function offerContact(text){
  const phone=(text.match(PHONE)||[]).map(s=>s.trim()).find(p=>!known(p)&&!declined.has(digits(p).slice(-9)));
  const email=(text.match(EMAIL)||[]).find(e=>!known('',e)&&!declined.has(e.toLowerCase()));
  if(!phone&&!email)return;
  const g=guessContact(text,email);
  const n=await contactForm('Contacto detectado en la nota',{id:uid(),created:now(),name:g.name,company:g.company,phone:phone||'',email:email||''},'Omitir');
  if(n)await saveContact(n);
  else{if(phone)declined.add(digits(phone).slice(-9));if(email)declined.add(email.toLowerCase())}
}

/* ---------- autocompletado @ ---------- */
function attachMentions(inp,ids){
  inp._ids=ids?[...ids]:[];inp._mo=false;
  let box=null,items=[],sel=0,at=0;
  const close=()=>{if(box)box.remove();box=null;inp._mo=false};
  const pick=c=>{
    const pos=inp.selectionStart,ins='@'+c.name+' ';
    inp.value=inp.value.slice(0,at)+ins+inp.value.slice(pos);
    const p=at+ins.length;inp.setSelectionRange(p,p);
    if(!inp._ids.includes(c.id))inp._ids.push(c.id);close();inp.focus();
  };
  const draw=()=>{
    if(!box){box=document.createElement('div');box.className='mn';document.body.appendChild(box)}
    const r=inp.getBoundingClientRect();box.style.left=r.left+'px';box.style.top=(r.bottom+2)+'px';
    box.innerHTML='';inp._mo=true;
    items.forEach((c,i)=>{
      const d=document.createElement('div');d.className='mi'+(i===sel?' sel':'');
      d.innerHTML='<b>'+esc(c.name||'(sin nombre)')+'</b> <small>'+esc([c.company,c.role,c.phone,c.email].filter(Boolean).join(' · '))+'</small>';
      d.onmousedown=e=>{e.preventDefault();pick(c)};box.appendChild(d);
    });
  };
  const update=()=>{
    const before=inp.value.slice(0,inp.selectionStart),m=before.match(/@([^\s@]*)$/);
    if(!m){close();return}
    at=m.index;const q=norm(m[1]);
    items=contacts.filter(c=>!q||norm([c.name,c.company,c.role].join(' ')).includes(q))
      .sort((a,b)=>norm(a.company).localeCompare(norm(b.company))||norm(a.name).localeCompare(norm(b.name))).slice(0,12);
    if(!items.length){close();return}
    sel=Math.min(sel,items.length-1);draw();
  };
  inp.addEventListener('input',update);
  inp.addEventListener('blur',()=>setTimeout(close,120));
  inp.addEventListener('keydown',e=>{
    if(!inp._mo)return;
    const k=e.key;
    if(k==='ArrowDown'||k==='ArrowUp'){sel=(sel+(k==='ArrowDown'?1:-1)+items.length)%items.length;draw()}
    else if(k==='Enter'||k==='Tab'){pick(items[sel])}
    else if(k==='Escape'){close()}
    else return;
    e.preventDefault();e.stopImmediatePropagation();
  },true);
}

/* ---------- tickets ---------- */
const openLine=t=>t.lines.find(l=>l.status!==RE);
const isDraft=l=>l.status===AR&&l.text==='';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDay=s=>{const [y,m,d]=s.split('-');return d+'/'+m+'/'+y.slice(2)};
const isDue=t=>{if(t.closed)return false;const o=openLine(t);return !!(o&&o.status===PE&&o.remind&&o.remind<=today())};
const tState=t=>t.closed?'ok':isDue(t)?'due':(openLine(t)&&openLine(t).status===PE)?'pe':'ar';
const mergeIds=(l,ids)=>{l.contacts=[...new Set([...(l.contacts||[]),...(ids||[])])]};

async function newTicket(text,ids){
  const t={id:uid(),created:now(),updated:now(),closed:null,lines:[{text,status:AR,created:now(),done:null,contacts:[...ids]}]};
  tickets.push(t);await save(t);offerContact(text);
}
async function markDone(t,l,typed,ids){
  if(isDraft(l)){
    if(!typed){t.closed=now();return save(t)}
    l.text=typed;mergeIds(l,ids);
  }
  const wasPending=l.status===PE;
  l.status=RE;l.done=now();
  if(wasPending){t.lines.push({text:'',status:AR,created:now(),done:null});await save(t);return typed&&offerContact(typed)}
  const more=await ask('Paso completado. Hay mas pasos?',[['Se acaba aqui',false],['Hay mas pasos',true,true]]);
  if(more===null){l.status=AR;l.done=null;return render()}
  if(more)t.lines.push({text:'',status:AR,created:now(),done:null});else t.closed=now();
  await save(t);if(typed)offerContact(typed);
}
async function saveDraft(t,l,text,status,ids,remind){if(!text)return;l.text=text;l.status=status;if(status===PE&&remind)l.remind=remind;mergeIds(l,ids);await save(t);offerContact(text)}

function hlHtml(html){
  const q=query.trim();if(!q)return html;
  const re=new RegExp(escRe(esc(q)),'gi');
  return html.split(/(<[^>]+>)/).map(p=>p.startsWith('<')?p:p.replace(re,m=>'<mark>'+m+'</mark>')).join('');
}
function lineHtml(l){
  let html=esc(l.text||'(sin texto)');
  (l.contacts||[]).forEach(id=>{
    const c=contacts.find(x=>x.id===id);if(!c||!c.name)return;
    const title=esc([c.company,c.role,c.phone,c.email].filter(Boolean).join(' - '));
    html=html.replace(new RegExp('@'+escRe(esc(c.name)),'gi'),m=>'<span class="chip" data-c="'+c.id+'" title="'+title+'">'+m+'</span>');
  });
  return hlHtml(html);
}

function ticketEl(t){
  const el=document.createElement('div');el.className='t s-'+tState(t)+(t.closed?' closed':'');
  const h=document.createElement('div');h.className='th';
  const fold=t.lines.length>1,isC=fold&&collapsed.has(t.id);
  h.innerHTML='<span>'+(fold?'<button class="ib fold" title="'+(isC?'Expandir':'Contraer')+'" data-f="'+t.id+'">'+(isC?'▸':'▾')+'</button> ':'')+'Creado '+fmt(t.created)+(t.closed?' &middot; <b>cerrado '+fmt(t.closed)+'</b>':'')+'</span>';
  const acts=document.createElement('span');
  if(t.closed){const r=document.createElement('button');r.className='ib';r.title='Reabrir';r.textContent='↩';r.onclick=()=>{t.closed=null;if(!t.lines.some(x=>x.status!==RE))t.lines.push({text:'',status:AR,created:now(),done:null});save(t)};acts.appendChild(r)}
  const d=document.createElement('button');d.className='ib';d.title='Borrar ticket';d.textContent='✕';
  d.onclick=async()=>{if(await ask('Borrar este ticket definitivamente?',[['Cancelar',false],['Borrar',true,true]]))remove(t)};
  acts.appendChild(d);h.appendChild(acts);el.appendChild(h);
  if(!isC)t.lines.forEach((l,i)=>el.appendChild(lineEl(t,l,i)));
  else{
    el.appendChild(lineEl(t,t.lines[0],0));
    const o=openLine(t),st=t.closed?'Cerrado':o?(isDraft(o)?'A realizar (falta escribir el siguiente paso)':o.status):'Realizada';
    const sm=document.createElement('div');sm.className='sum';
    sm.innerHTML='+'+(t.lines.length-1)+' paso(s) más · Estado: <span class="pill '+(t.closed?'re':o?cls(o.status):'re')+'">'+esc(st)+'</span>';
    if(o&&o.remind&&!t.closed)sm.innerHTML+=(isDue(t)?' <span class="badge">Reclamar</span>':'')+' seguimiento '+fmtDay(o.remind);
    if(o&&!t.closed&&!isDraft(o))sm.innerHTML+=' <span class="mut">'+esc(o.text.length>90?o.text.slice(0,90)+'...':o.text)+'</span>';
    el.appendChild(sm);
  }
  return el;
}
function lineEl(t,l,i){
  const indent=i>0?22:0;
  if(isDraft(l)&&!t.closed){
    const w=document.createElement('div');w.className='draft';w.style.marginLeft=indent+'px';
    const inp=document.createElement('input');inp.placeholder='Siguiente paso... (@ para mencionar un contacto)';
    attachMentions(inp);
    const rem=document.createElement('input');rem.type='date';rem.className='rem';rem.min=today();rem.title='Fecha de seguimiento (solo si lo dejas Pendiente)';
    const remL=document.createElement('label');remL.textContent='Recordar el';remL.append(' ',rem);
    const mk=(label,st)=>{const b=document.createElement('button');b.className='b';b.textContent=label;b.onclick=()=>saveDraft(t,l,inp.value.trim(),st,inp._ids,rem.value);return b};
    const done=document.createElement('button');done.className='b pri';done.textContent='✓ Realizada';done.onclick=()=>markDone(t,l,inp.value.trim(),inp._ids);
    inp.onkeydown=e=>{if(e.key==='Enter'&&!e.defaultPrevented)saveDraft(t,l,inp.value.trim(),AR,inp._ids)};
    w.append(inp,mk('A realizar',AR),remL,mk('Pendiente',PE),done);
    setTimeout(()=>{if(view==='hoy'||query)inp.focus()},0);
    return w;
  }
  const r=document.createElement('div');r.className='l'+(l.status===RE?' done':'');r.style.marginLeft=indent+'px';
  const active=l.status!==RE&&!t.closed;
  let pill;
  if(active){pill=document.createElement('button');pill.className='pill '+cls(l.status);pill.title='Cambiar entre A realizar / Pendiente';pill.onclick=()=>{l.status=l.status===AR?PE:AR;if(l.status===AR)l.remind=null;save(t)}}
  else{pill=document.createElement('span');pill.className='pill '+cls(l.status)}
  pill.textContent=l.status;
  const tx=document.createElement('span');tx.className='tx';tx.innerHTML=lineHtml(l);
  const dt=document.createElement('span');dt.className='d';
  dt.textContent=l.status===RE&&l.done?fmt(l.done):(l.status===PE?'esperando '+days(l.created)+' d':fmt(l.created));
  r.append(pill,tx);
  if(l.status===PE&&active){
    const due=!!(l.remind&&l.remind<=today());
    if(due){const bd=document.createElement('span');bd.className='badge';bd.textContent='Reclamar';r.appendChild(bd)}
    const rem=document.createElement('input');rem.type='date';rem.className='rem'+(due?' due':'');rem.value=l.remind||'';
    rem.title='Fecha de seguimiento: ese dia el ticket sube a "Reclamar"';
    rem.onchange=()=>{l.remind=rem.value||null;save(t)};r.appendChild(rem);
  }
  r.appendChild(dt);
  const ed=document.createElement('button');ed.className='ib';ed.title='Editar texto';ed.textContent='✎';
  ed.onclick=()=>{const inp=document.createElement('input');inp.className='ed';inp.value=l.text;tx.replaceWith(inp);attachMentions(inp,l.contacts);inp.focus();
    const commit=()=>{const v=inp.value.trim();if(v&&v!==l.text){l.text=v;mergeIds(l,inp._ids);save(t).then(()=>offerContact(v))}else render()};
    inp.onblur=commit;inp.onkeydown=e=>{if(e.key==='Enter'&&!e.defaultPrevented)inp.blur();if(e.key==='Escape'&&!e.defaultPrevented){inp.onblur=null;render()}}};
  r.appendChild(ed);
  if(active){const b=document.createElement('button');b.className='b';b.textContent='✓ Realizada';b.onclick=()=>markDone(t,l);r.appendChild(b)}
  return r;
}

/* ---------- contactos ---------- */
function contactMatches(c,q){
  const nq=norm(q),dq=digits(q);
  return norm([c.name,c.company,c.role,c.email,c.phone].join(' ')).includes(nq)||(dq.length>=3&&/\d/.test(dq)&&digits(c.phone).includes(dq));
}
function linkedTickets(c){
  const dp=digits(c.phone),em=(c.email||'').toLowerCase(),mn='@'+norm(c.name);
  return tickets.filter(t=>t.lines.some(l=>(l.contacts||[]).includes(c.id)||
    (dp.length>=9&&digits(l.text).includes(dp))||(em&&l.text.toLowerCase().includes(em))||(c.name&&norm(l.text).includes(mn)))).sort(byNew);
}
function contactEl(c){
  const el=document.createElement('div');el.className='c'+(expanded.has(c.id)?' open':'');el.dataset.id=c.id;
  const lt=linkedTickets(c);
  let h='<div class="nm">'+esc(c.name||'(sin nombre)')+'</div>';
  h+='<div class="ro">'+esc([c.company,c.role].filter(Boolean).join(' · ')||'sin empresa')+'</div>';
  if(c.phone)h+='<div class="ln">Tel: <a href="tel:'+esc(digits(c.phone))+'">'+esc(c.phone)+'</a></div>';
  if(c.email)h+='<div class="ln">Mail: <a href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a></div>';
  el.innerHTML=h;
  const a=document.createElement('div');a.className='ac';
  const mk=(label,fn)=>{const b=document.createElement('button');b.className='b';b.textContent=label;b.onclick=fn;a.appendChild(b)};
  mk('Tickets ('+lt.length+')',()=>{expanded.has(c.id)?expanded.delete(c.id):expanded.add(c.id);render()});
  mk('Editar',()=>editContactDialog(c));
  mk('Borrar',async()=>{if(await ask('Borrar el contacto "'+(c.name||c.phone||c.email)+'"?',[['Cancelar',false],['Borrar',true,true]]))removeContact(c)});
  el.appendChild(a);
  if(expanded.has(c.id)){
    const tl=document.createElement('div');tl.className='tl';
    if(!lt.length)tl.innerHTML='<div class="empty">Sin tickets relacionados</div>';
    lt.forEach(t=>tl.appendChild(ticketEl(t)));
    el.appendChild(tl);
  }
  return el;
}
function contactsSection(main,title,list,group){
  const h=document.createElement('h2');h.textContent=title+' ('+list.length+')';main.appendChild(h);
  if(!list.length){const e=document.createElement('div');e.className='empty';e.textContent='Sin contactos';main.appendChild(e);return}
  const sorted=[...list].sort((a,b)=>norm(a.company||'~').localeCompare(norm(b.company||'~'))||norm(a.name).localeCompare(norm(b.name)));
  if(!group){const g=document.createElement('div');g.className='grid';sorted.forEach(c=>g.appendChild(contactEl(c)));main.appendChild(g);return}
  let cur=null,g=null;
  sorted.forEach(c=>{
    const k=norm(c.company||'');
    if(k!==cur||!g){cur=k;const s=document.createElement('h2');s.textContent=c.company||'Sin empresa';main.appendChild(s);g=document.createElement('div');g.className='grid';main.appendChild(g)}
    g.appendChild(contactEl(c));
  });
}
function goContact(id){
  view='con';query='';$('#q').value='';expanded.add(id);render();
  const el=document.querySelector('.c[data-id="'+id+'"]');if(el)el.scrollIntoView({block:'center'});
}

/* ---------- busqueda y vistas ---------- */
function matches(t,q,ids){
  const nq=norm(q),dq=digits(q);
  return t.lines.some(l=>{const n=norm(l.text);
    return n.includes(nq)||(dq.length>=3&&/\d/.test(dq)&&digits(n).includes(dq))||(l.contacts||[]).some(id=>ids.has(id))});
}
const byNew=(a,b)=>new Date(b.updated||b.created)-new Date(a.updated||a.created);

function section(main,title,list){
  const h=document.createElement('h2');h.textContent=title+' ('+list.length+')';main.appendChild(h);
  if(!list.length){const e=document.createElement('div');e.className='empty';e.textContent='Nada por aqui';main.appendChild(e)}
  list.forEach(t=>main.appendChild(ticketEl(t)));
}
function render(){
  const main=$('#main');main.innerHTML='';
  ['hoy','bus','con'].forEach(v=>$('#n'+v).classList.toggle('on',view===v));
  if(view==='hoy'){
    const f=document.createElement('form');f.className='new';
    f.innerHTML='<input id="nt" placeholder="Nueva nota / ticket (Enter para crear, @ para mencionar un contacto)..." autocomplete="off" autofocus><button class="b pri">Crear</button><button type="button" class="b" id="fa">Contraer todo</button><button type="button" class="b" id="fe">Expandir todo</button>';
    f.onsubmit=e=>{e.preventDefault();const i=$('#nt'),v=i.value.trim();if(v)newTicket(v,i._ids)};
    main.appendChild(f);attachMentions($('#nt'));$('#fa').onclick=()=>foldAll(true);$('#fe').onclick=()=>foldAll(false);
    const open=tickets.filter(t=>!t.closed).sort(byNew);
    const due=open.filter(isDue).sort((a,b)=>openLine(a).remind.localeCompare(openLine(b).remind));
    if(due.length)section(main,'Reclamar hoy (seguimiento vencido)',due);
    section(main,'A realizar (me toca a mi)',open.filter(t=>openLine(t)&&openLine(t).status===AR));
    section(main,'Pendiente (espero a otros)',open.filter(t=>openLine(t)&&openLine(t).status===PE&&!isDue(t)));
  }else if(view==='bus'){
    const q=query.trim();
    if(!q){main.innerHTML='<div class="empty">Escribe una empresa, telefono o nombre arriba.</div>';return}
    const cs=contacts.filter(c=>contactMatches(c,q));
    const ids=new Set(cs.map(c=>c.id));
    if(cs.length)contactsSection(main,'Contactos',cs,false);
    const res=tickets.filter(t=>matches(t,q,ids)).sort(byNew);
    section(main,'Tickets para "'+q+'" (mas recientes primero)',res);
  }else{
    const bar=document.createElement('div');bar.className='bar';
    const nb=document.createElement('button');nb.className='b pri';nb.textContent='+ Nuevo contacto';nb.onclick=()=>newContactDialog({});
    bar.appendChild(nb);main.appendChild(bar);
    const q=query.trim();
    contactsSection(main,q?'Contactos para "'+q+'"':'Todos los contactos',q?contacts.filter(c=>contactMatches(c,q)):contacts,true);
  }
}
$('#main').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(c)return goContact(c.dataset.c);
  const f=e.target.closest('.fold');if(f)toggleFold(f.dataset.f);
});
function foldAll(on){tickets.filter(t=>t.lines.length>1&&!t.closed).forEach(t=>on?collapsed.add(t.id):collapsed.delete(t.id));saveCollapsed();render()}
$('#nhoy').onclick=()=>{view='hoy';$('#q').value='';query='';render()};
$('#nbus').onclick=()=>{view='bus';$('#q').focus();render()};
$('#ncon').onclick=()=>{view='con';$('#q').value='';query='';render()};
$('#q').oninput=e=>{query=e.target.value;if(view!=='con')view=query.trim()?'bus':'hoy';render()};
$('#imp').onclick=()=>$('#impf').click();
$('#impf').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const bad=m=>ask(m,[['Cerrar',true,true]]);
  let data;try{data=JSON.parse(await f.text())}catch(x){return bad('El fichero no es un JSON valido.')}
  if(!data||!Array.isArray(data.tickets))return bad('El fichero no parece una copia de este gestor.');
  const ok=await ask('Importar reemplazara los datos actuales ('+tickets.length+' tickets, '+contacts.length+' contactos) por los del fichero ('+data.tickets.length+' tickets, '+(data.contacts||[]).length+' contactos). Antes se guarda una copia automatica. Continuar?',[['Cancelar',false],['Importar',true,true]]);
  if(!ok)return;
  const r=await fetch('/api/import',{method:'POST',body:JSON.stringify(data)});
  if(!r.ok)return bad('No se pudo importar: fichero invalido.');
  await load();
};
load();
</script>
</body>
</html>
